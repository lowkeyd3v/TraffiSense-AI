services:
  - type: web
    name: traffisense-backend
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: >
      pip install -r requirements.txt -r requirements_train.txt &&
      python ml_model.py &&
      cp ../ml/model.joblib ./model.joblib

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      - key: ALLOWED_ORIGINS
        value: https://traffisense-ai.vercel.app

      - key: DATABASE_URL
        fromDatabase:
          name: traffisense-db
          property: connectionString

      # Routing service (issue #43): defaults to the public OSRM demo server
      # if unset, which is fine for evaluation but not recommended for real
      # production traffic. Self-host OSRM (see docker-compose.osrm.yml) or
      # use a managed OSRM-compatible provider, then uncomment and point
      # this at it, e.g.:
      # - key: OSRM_BASE_URL
      #   value: https://osrm.your-domain.com

      # Retraining endpoint protection (issue #41): requires callers to send
      # a matching `X-API-Key` header on POST /api/deployments/{id}/resolve
      # and POST /api/model/rollback. Generate a strong random value here —
      # Render can auto-generate one if you set `generateValue: true` instead
      # of `value:` in the dashboard. Leaving this unset leaves the endpoint
      # open (fine for local dev, not for production).
      # - key: RESOLVE_API_KEY
      #   value: replace-with-a-strong-random-secret

      # Optional: override the default resolve-endpoint rate limit
      # (5 requests / 60s per caller).
      # - key: RESOLVE_RATE_LIMIT_MAX
      #   value: "5"
      # - key: RESOLVE_RATE_LIMIT_WINDOW
      #   value: "60"

databases:
  - name: traffisense-db
    plan: free
    databaseName: traffisense
    user: traffisense