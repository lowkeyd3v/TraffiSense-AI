services:
  - type: web
    name: traffisense-backend
    runtime: python
    plan: free              # bump to starter+ if you add a persistent disk instead of Postgres
    rootDir: backend
    buildCommand: >
      pip install -r backend/requirements.txt &&
      python backend/ml_model.py &&
      cp ../ml/model.joblib ./model.joblib
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: traffisense-db
          property: connectionString

databases:
  - name: traffisense-db
    plan: free               # Render free Postgres expires after 90 days — see note below
    databaseName: traffisense
    user: traffisense
