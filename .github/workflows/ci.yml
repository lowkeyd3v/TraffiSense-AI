name: Backend and ML CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements_train.txt

      - name: Verify dependencies
        run: |
          python -m pip list
          python -c "import pandas, numpy, sklearn, joblib, pytest; print('Dependencies installed successfully')"

      - name: Train ML model
        working-directory: backend
        run: |
          python ml_model.py

      - name: Copy model to backend (mirrors render.yaml deploy step)
        working-directory: backend
        run: |
          cp ../ml/model.joblib ./model.joblib

      - name: Run tests
        run: |
          python -m pytest