name: Backend and ML CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install -r backend/requirements.txt
        pip install pytest

    - name: Run tests
      run: |
        pytest