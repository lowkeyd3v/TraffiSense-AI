name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-train.txt

      - name: Verify installation
        run: |
          python -c "import pandas, numpy, sklearn, joblib, pytest; print('Dependencies installed successfully')"

      - name: Train ML model
        run: |
          python ml_model.py

      - name: Run tests
        run: |
          python -m pytest -v

  frontend-test:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install packages
        run: npm ci

      - name: Build frontend
        run: npm run build