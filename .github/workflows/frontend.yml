name: Frontend Build

on:
  pull_request:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend


    steps:

    - uses: actions/checkout@v4


    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 20


    - name: Install packages
      run:
        npm install


    - name: Build React app
      run:
        npm run build